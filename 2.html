<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Same, But Different</title>
<style>
:root{--ink:#292720;--muted:#939087;--line:#eceae4;--accent:#d97757;--peach:#fcf5f0;--blue:#aab9bd;--taupe:#c8bdb0}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#fff;color:var(--ink)}
body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:32px}
.slide{width:min(1280px,100%);min-height:min(760px,calc(100vh - 64px));display:flex;flex-direction:column;padding:48px 58px 36px;border:1px solid var(--line);background:white}
header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:34px}
h1{font-size:clamp(32px,4.3vw,58px);font-weight:400;letter-spacing:-.055em;line-height:1.05;margin:0} h1 span{color:var(--accent)}
.index,.label{font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}.index{white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:14px;flex:1;min-height:500px}.row{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#faf9f6}
.panel{position:relative;overflow:hidden;border:0;background:transparent;min-height:230px}.label{position:absolute;top:20px;left:22px;z-index:2}
.circuit-image{object-fit:contain}.visual{position:absolute;inset:32px 20px 12px;width:calc(100% - 40px);height:calc(100% - 44px)}
.compare{display:flex;align-items:center;justify-content:center;gap:clamp(18px,4vw,55px);padding:43px 20px 22px;background:transparent}
.digit{width:clamp(80px,10vw,128px);aspect-ratio:1;border-radius:8px;background:#171715;display:grid;place-items:center;border:1px solid #33312d}.digit img{width:84%;height:84%;object-fit:contain;image-rendering:pixelated}
.operator{font-weight:300;font-size:clamp(35px,4vw,52px);line-height:1;color:var(--accent)}.operator.muted{color:#a8a399}
.neuron-line{fill:none;stroke:#c5cec9;stroke-width:1.3;stroke-linecap:round}.neuron-line.warm{stroke:#dac8bc}.branch{fill:none;stroke:#d6dcd7;stroke-width:1;stroke-linecap:round}.soma{fill:#f7f5f0;stroke:#aab9b3;stroke-width:1.3}.core{fill:#d97757;opacity:.7}.pulse{fill:#d97757;filter:url(#glow)}.pulse-halo{fill:#e7c8b8;opacity:.45;filter:url(#blur)}
.circuit-wire{fill:none;stroke:#aeb7b4;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.gate{fill:#fff;stroke:#a6b1ae;stroke-width:1.5}.bit{font:11px ui-monospace,monospace;fill:#939087}.hot{stroke:#d97757}.node{fill:#d97757}
footer{display:flex;justify-content:space-between;margin-top:24px;color:#b5b1a9;font:10px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:700px){body{padding:12px}.slide{padding:28px 20px 22px;min-height:0}header{margin-bottom:24px}.grid{grid-template-columns:1fr;min-height:0;gap:8px}.panel{min-height:180px}.visual{inset:30px 8px 8px;width:calc(100% - 16px);height:calc(100% - 38px)}.label{top:14px;left:14px;font-size:9px}.compare{gap:10px;padding:35px 8px 12px}.digit{width:min(30%,80px)}.operator{font-size:30px}footer{margin-top:18px}}
@media(prefers-reduced-motion:reduce){.pulse,.pulse-halo{display:none}}
</style>
</head>
